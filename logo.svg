<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Brutalist Outer Box Offset Shadow -->
  <rect x="10" y="10" width="100" height="100" rx="8" fill="#000000" />
  
  <!-- Main Brutalist White Box -->
  <rect x="6" y="6" width="100" height="100" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
  
  <!-- Left Side: 6 Stacked Color Tier Bars (S, A, B, C, D, F) -->
  <g stroke="#000000" stroke-width="3" stroke-linejoin="miter">
    <!-- Red (S Tier) -->
    <rect x="16" y="16" width="28" height="13" fill="#e11d48" />
    <!-- Orange (A Tier) -->
    <rect x="16" y="29" width="28" height="13" fill="#f97316" />
    <!-- Yellow (B Tier) -->
    <rect x="16" y="42" width="28" height="13" fill="#eab308" />
    <!-- Green (C Tier) -->
    <rect x="16" y="55" width="28" height="13" fill="#22c55e" />
    <!-- Blue (D Tier) -->
    <rect x="16" y="68" width="28" height="13" fill="#3b82f6" />
    <!-- Charcoal Gray (F Tier) -->
    <rect x="16" y="81" width="28" height="13" fill="#4b5563" />
  </g>

  <!-- Right Side: Pixelated 'P' Letter -->
  <g fill="#000000">
    <!-- Main Vertical Stem of P -->
    <rect x="56" y="18" width="9" height="76" />
    <!-- Top Horizontal Bar of P Loop -->
    <rect x="65" y="18" width="28" height="9" />
    <!-- Right Vertical Wall of P Loop -->
    <rect x="84" y="27" width="9" height="24" />
    <!-- Bottom Horizontal Bar of P Loop -->
    <rect x="65" y="51" width="28" height="9" />
  </g>
</svg>
